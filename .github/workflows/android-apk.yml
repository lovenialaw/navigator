name: Build Android APK

# Builds an installable APK on GitHub's servers, so no local Android build is needed.
# Run it from the repo's Actions tab (Run workflow), then download the "tuju-apk" artifact.
on:
  workflow_dispatch:
  # "Run workflow" only shows for files on the default branch, so also build on push here.
  push:
    branches: [cursor/offline-map-packs-12ff]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test -- --ci

      # android/ is generated, not committed (see .gitignore).
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # A release build bundles the JavaScript into the APK, so it runs on its own with no
      # Metro server. Expo's template signs it with the debug key: fine for installing on
      # your own phone, NOT for the Play Store.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tuju-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
